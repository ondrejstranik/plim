[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name="plim"
version="0.0.1"
dependencies = [
        'viscope @ git+https://github.com/ondrejstranik/viscope.git',
        'spectralCamera @ git+https://github.com/ondrejstranik/spectralCamera.git',
        'numpy<2',
        'scipy',
        'scikit-image',
        'matplotlib',
        'tifffile',
        'napari',
        'PyQt5',
        'qtpy',
        'magicgui',
        'pyqtgraph',
        'pyserial',
        'lmfit',
        'pytest',
        ]
requires-python='>=3.9'
authors = [
        {name = "Ondrej Stranik", email = "ondra.stranik@gmail.com"},
]

description="package for plasmon imaging"
readme = "README.md"
license = "MIT"
keywords = ["instrumentation"]
classifiers = [
  "Development Status :: 3- Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
docs = [
        'mkdocs',
        'mkdocstrings[python]',
        ]

[project.urls]
Repository = "https://github.com/ondrejstranik/plim"

[tool.setuptools.packages.find]
include = ["plim*"]
